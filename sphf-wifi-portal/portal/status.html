<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wi-Fi Status | SPHF</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="portal">

        <section class="portal-card">

            <h1>Connection Status</h1>

            <p class="welcome">
                You are connected to SPHF Wi-Fi.
            </p>

            <div class="status-box">

                <h2>Connection Active</h2>

                <p>
                    Your demo connection is currently active.
                </p>

                <p>
                    Network: <strong>SPHF Community Wi-Fi</strong>
                </p>

                <p>
                    Status: <strong>Connected</strong>
                </p>

            </div>

            <a href="logout.html" class="button-link">
                Logout
            </a>

        </section>

    </main>

</body>
</html>
